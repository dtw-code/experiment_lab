# cleanup.yaml - written by `guardian setup`, safe to edit by hand.
# Read from INSIDE this repository by guardian/cleanup.py Config.load, so it travels with it.
#   sdk_calls       how this app reads flags; a reference is found by these calls
#   keep_patterns   conversion/analytics calls a cleanup must leave untouched
#   window_lines    an edit must sit within this many lines of a flag reference
#   commands        lint/build/test. A `test` command is REQUIRED: a cleanup is judged by
#                   running it before and after the edits, and is refused without it.
#
# Every one of these takes the flag key as its first literal argument, which is what lets a cleanup
# tell "this edit removes MY flag" from "this edit removes somebody else's":
#   read_experiment_flag / read_flag   learnloop/flags.py, the only two Flagsmith reads
#   get_experiment_flag                the SDK call read_experiment_flag wraps
#   arm                                app.py, the per-session cache around read_experiment_flag
#   arm_of                             learnloop/sim.py, the bulk path (2nd positional arg, see below)
#   outcome_table                      learnloop/knobs.py, the simulator's arm table
#   serve                              tests/conftest.py, the `arm` fixture
#
# `arm_of(resolved, "flag", ...)` takes the key SECOND, so the regex that extracts a key from a call
# does not reach it - but listing it still makes the "this edit removes somebody else's flag" check
# fire on the lines around it in sim.py, where two experiments sit seven lines apart.
sdk_calls:
- read_experiment_flag
- read_flag
- get_experiment_flag
- arm
- arm_of
- outcome_table
- serve
exclude:
- '**/*.lock'
# Conversions are product metrics and outlive the experiment that measured them: `app.py` records
# every one with a literal `flags.track_event(` call so that this guard has something to protect.
# A cleanup may delete the arm branch above such a line, never the line.
keep_patterns:
- track_event(
- trackEvent(
window_lines: 15
max_changed_lines: auto
commands:
  # Two separate bugs stacked here, both confirmed live inside an actual cleanup worktree:
  #   1. `python` on this machine resolves to the MSYS64 interpreter, which has no pytest,
  #      streamlit or flagsmith installed ("No module named pytest"), not the one
  #      `requirements.txt` was installed into. `py` is the launcher this app's own README and
  #      SETUP.md already use everywhere else, and it resolves correctly.
  #   2. This repo's `pytest.ini` already sets `addopts = -ra -q`. A command that ALSO passes
  #      `-q` stacks to `-qq` ("very quiet"), which pytest suppresses the final `N passed in Xs`
  #      summary line for entirely - rc is still 0, but guardian/cleanup.py's `run_checks` parses
  #      that summary line to count tests, reads zero, and the baseline refuses with `no_tests`
  #      even though every test passed. Do not add `-q` here; pytest.ini already supplies it.
  test: py -m pytest
